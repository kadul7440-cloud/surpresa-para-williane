<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meu amor ❤️</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
  body{
    background:#f7f7f7;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;overflow:hidden;
  }
  .login{
    width:min(430px,92vw); padding:34px 28px;
    background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.9);
    border-radius:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.15);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    text-align:center;
  }
  .login h1{margin:0 0 8px;font-size:28px}
  .login p{margin:0 0 25px;color:#555}
  .field{text-align:left;margin:16px 0}
  label{display:block;font-weight:bold;margin-bottom:7px}
  input{
    width:100%;padding:14px 15px;border-radius:12px;
    border:1px solid #bbb;background:rgba(255,255,255,.75);
    font-size:16px;outline:none;
  }
  input:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .error{min-height:21px;color:#d40000;font-weight:800;font-size:14px;margin-top:6px}
  button{
    width:100%;padding:14px;border:0;border-radius:12px;
    background:#111;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;
    margin-top:8px;
  }
  button:hover{transform:translateY(-1px)}
  #loveScreen{
    display:none;position:fixed;inset:0;background:#000;color:#fff;
    overflow:auto;padding:55px 20px 70px;
  }
  #photo{
    position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:.11;filter:grayscale(100%);pointer-events:none;
  }
  .content{
    position:relative;z-index:2;max-width:780px;margin:auto;
    font-size:18px;line-height:1.75;white-space:pre-wrap;
    text-shadow:0 1px 8px #000;
  }
  .cursor{display:inline-block;width:2px;height:1.1em;background:#fff;vertical-align:-.15em;animation:blink .7s infinite}
  .signature-heart{font-size:30px;display:inline-block;animation:pulse 1s infinite}
  .final{
    text-align:center;font-size:36px;font-weight:bold;margin-top:38px;
    letter-spacing:1px;
  }
  .heart{
    position:fixed;top:-40px;z-index:1;color:#ff5c9a;
    font-size:var(--size);animation:fall var(--duration) linear infinite;
    left:var(--left);animation-delay:var(--delay);pointer-events:none;
    text-shadow:0 0 12px rgba(255,92,154,.55);
  }
  @keyframes fall{to{transform:translateY(115vh) rotate(360deg);}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  @keyframes blink{50%{opacity:0}}
  @media(max-width:600px){
    .content{font-size:16px;line-height:1.65}
    .final{font-size:28px}
  }
</style>
</head>
<body>
  <section class="login" id="login">
    <h1>Uma surpresa para você ❤️</h1>
    <p>Entre com seu nome e nossa senha.</p>

    <div class="field">
      <label for="name">Nome</label>
      <input id="name" autocomplete="off" placeholder="Digite seu nome">
      <div class="error" id="nameError"></div>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Digite a senha">
      <div class="error" id="passError"></div>
    </div>

    <button onclick="enterLove()">Entrar ❤️</button>
  </section>

<script>
const message = `Meu amor,

Hoje faz 1 ano e 3 meses desde que você entrou na minha vida e decidiu ficar. Parece pouco tempo quando escrevo no papel, mas quando penso em tudo que vivemos, percebe-se que foram 15 meses de uma intensidade que muita gente não vive em anos.

Lembro do início, daquela mistura de nervosismo e vontade de te conhecer cada dia um pouco mais. E de lá pra cá, cada mês trouxe uma camada nova de você que eu fui aprendendo a amar: seu jeito de rir das próprias piadas antes mesmo de terminar de contar, a forma como você se importa com os detalhes que fazem os outros se sentirem especiais, a paciência que você tem comigo mesmo nos meus dias mais difíceis.

Namorar você tem sido descobrir, todos os dias, que amor não é um sentimento parado — é algo que cresce, se transforma, se aprofunda. E isso me dá uma paz enorme, porque significa que estamos construindo algo de verdade, não só vivendo um momento bonito.

Obrigado por cada gesto de carinho, por cada conversa boba até tarde da noite, por segurar minha mão nos momentos difíceis e comemorar comigo os fáceis. Obrigado por ser meu porto seguro e, ao mesmo tempo, meu incentivo pra ser uma pessoa melhor.

Se esses 15 meses já foram assim tão bons, eu mal posso esperar pra ver o que vem por aí — os planos que ainda vamos fazer, os lugares que ainda vamos conhecer juntos, as memórias que ainda nem imaginamos que vamos criar.

Feliz aniversário de namoro, meu amor. Que venham muitos e muitos meses — e um dia, quem sabe, anos — assim, cheios de você.

Com todo o meu amor (Neneco)`;

function enterLove(){
  const name = document.getElementById('name').value.trim();
  const pass = document.getElementById('password').value.trim();
  const validName = name === "Williane" || name === "Amor";
  const validPass = pass === "20/05";

  document.getElementById('nameError').textContent = validName ? "" : "senha incorreta";
  document.getElementById('passError').textContent = validPass ? "" : "senha incorreta";

  if(validName && validPass){
    document.getElementById('login').style.display='none';
    document.getElementById('loveScreen').style.display='block';
    startHearts();
    typeMessage();
  }
}

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.getElementById('login').style.display !== 'none') enterLove();
});

function startHearts(){
  const screen=document.getElementById('loveScreen');
  for(let i=0;i<65;i++){
    const h=document.createElement('div');
    h.className='heart';
    h.textContent='♥';
    h.style.setProperty('--left', Math.random()*100+'vw');
    h.style.setProperty('--size', (12+Math.random()*25)+'px');
    h.style.setProperty('--duration', (5+Math.random()*9)+'s');
    h.style.setProperty('--delay', (-Math.random()*12)+'s');
    screen.appendChild(h);
  }
}

async function typeMessage(){
  const box=document.getElementById('text');
  const cursor=document.createElement('span');
  cursor.className='cursor';
  box.appendChild(cursor);
  for(const char of message){
    cursor.before(document.createTextNode(char));
    await new Promise(r=>setTimeout(r, 22));
  }
  cursor.remove();

  const sig=document.createElement('div');
  sig.innerHTML='Com todo o meu amor (Neneco) <span class="signature-heart">♥</span>';
  box.appendChild(sig);

  const final=document.createElement('div');
  final.className='final';
  final.textContent='Sempre nós ∞';
  box.appendChild(final);
}
</script>
